<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoVélo — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --white: #ffffff;
      --black: #111111;
      --red: #c0392b;
      --gray: #888888;
      --border: #e5e3df;
    }

    body {
      background: var(--bg);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-icon { width: 48px; height: 48px; }

    .logo-text { display: flex; flex-direction: column; line-height: 1; }

    .logo-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--black);
      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--gray);
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
    }

    .car-wrap {
      margin-bottom: 48px;
      animation: glide 3s ease-in-out infinite;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 28px;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.6s ease infinite;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(52px, 9vw, 96px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
      color: var(--black);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 em { font-style: normal; color: var(--red); }

    .sub {
      font-size: 16px;
      font-weight: 300;
      color: var(--gray);
      line-height: 1.7;
      max-width: 380px;
      margin-bottom: 48px;
    }

    .progress-wrap {
      width: 100%;
      max-width: 420px;
      margin-bottom: 48px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .progress-track {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--red);
      border-radius: 99px;
      animation: fill 2s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .notify-wrap {
      display: flex;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
      transition: border-color 0.2s;
    }

    .notify-wrap:focus-within { border-color: #aaa; }

    .notify-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 18px;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      color: var(--black);
      background: transparent;
    }

    .notify-wrap input::placeholder { color: #bbb; }

    .notify-wrap button {
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 14px 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .notify-wrap button:hover { background: var(--red); }

    footer {
      padding: 24px 48px;
      border-top: 1px solid var(--border);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-copy { font-size: 12px; color: var(--gray); }

    .footer-links { display: flex; gap: 24px; }

    .footer-links a {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--black); }

    @keyframes glide {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    @keyframes fill { to { width: 72%; } }

    @media (max-width: 600px) {
      header, footer { padding: 20px; }
      .header-right { display: none; }
      footer { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="10" fill="#111111"/>
        <path d="M24 6 L38 13 L38 27 C38 36 24 43 24 43 C24 43 10 36 10 27 L10 13 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <path d="M18 34 L24 16 L30 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M20.5 27.5 H27.5" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">
        <span class="logo-name">AutoVélo</span>
        <span class="logo-sub">Premium Motors</span>
      </div>
    </a>
    <span class="header-right">Est. 2024</span>
  </header>

  <main>

    <div class="car-wrap">
      <svg width="320" height="130" viewBox="0 0 320 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="160" cy="122" rx="110" ry="7" fill="#e5e3df"/>
        <rect x="30" y="75" width="260" height="38" rx="8" fill="#111111"/>
        <path d="M80 75 C90 45 105 35 140 32 L200 32 C228 32 240 45 248 75 Z" fill="#1a1a1a"/>
        <path d="M145 36 C148 36 186 36 195 36 C220 42 230 58 234 72 L148 72 Z" fill="#d0e8f0" opacity="0.7"/>
        <path d="M88 72 C93 55 100 42 115 36 L140 36 L143 72 Z" fill="#d0e8f0" opacity="0.6"/>
        <rect x="30" y="88" width="260" height="4" rx="2" fill="#c0392b"/>
        <circle cx="88" cy="113" r="18" fill="#222"/>
        <circle cx="88" cy="113" r="11" fill="#555"/>
        <circle cx="88" cy="113" r="5" fill="#999"/>
        <circle cx="232" cy="113" r="18" fill="#222"/>
        <circle cx="232" cy="113" r="11" fill="#555"/>
        <circle cx="232" cy="113" r="5" fill="#999"/>
        <rect x="276" y="82" width="14" height="7" rx="3" fill="#fffbdc"/>
        <rect x="30" y="82" width="10" height="7" rx="3" fill="#c0392b"/>
        <line x1="162" y1="76" x2="162" y2="112" stroke="#333" stroke-width="1"/>
        <rect x="125" y="90" width="18" height="4" rx="2" fill="#444"/>
        <rect x="178" y="90" width="18" height="4" rx="2" fill="#444"/>
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Under Construction
    </div>

    <h1>We're<br/>Getting<br/><em>Ready.</em></h1>

    <p class="sub">
      Our new website is being built with the same precision we put into every vehicle. Something exceptional is on the way.
    </p>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Progress</span>
        <span>72%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="notify-wrap">
      <input type="email" placeholder="Enter your email address" />
      <button type="button">Notify Me</button>
    </div>

  </main>

  <footer>
    <span class="footer-copy">© 2024 AutoVélo Premium Motors. All rights reserved.</span>
    <nav class="footer-links">
      <a href="#">Contact</a>
      <a href="#">Privacy</a>
      <a href="#">Instagram</a>
    </nav>
  </footer>

</body>
</html>
