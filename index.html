<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motory — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --white: #ffffff;
      --black: #111111;
      --red: #2b5ac0;
      --gray: #888888;
      --border: #e5e3df;
    }

    body {
      background: var(--bg);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-icon { width: 88px; height: 88px; align-items: center; }

    .logo-text { display: flex; flex-direction: column; line-height: 1; }

    .logo-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--black);
      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--gray);
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
    }

    .car-wrap {
      margin-bottom: 48px;
      animation: glide 3s ease-in-out infinite;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 28px;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.6s ease infinite;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(52px, 9vw, 96px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
      color: var(--black);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 em { font-style: normal; color: var(--red); }

    .sub {
      font-size: 16px;
      font-weight: 300;
      color: var(--gray);
      line-height: 1.7;
      max-width: 380px;
      margin-bottom: 48px;
    }

    .progress-wrap {
      width: 100%;
      max-width: 420px;
      margin-bottom: 48px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .progress-track {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--red);
      border-radius: 99px;
      animation: fill 2s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .notify-wrap {
      display: flex;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
      transition: border-color 0.2s;
    }

    .notify-wrap:focus-within { border-color: #aaa; }

    .notify-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 18px;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      color: var(--black);
      background: transparent;
    }

    .notify-wrap input::placeholder { color: #bbb; }

    .notify-wrap button {
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 14px 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .notify-wrap button:hover { background: var(--red); }

    footer {
      padding: 24px 48px;
      border-top: 1px solid var(--border);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-copy { font-size: 12px; color: var(--gray); }

    .footer-links { display: flex; gap: 24px; }

    .footer-links a {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--black); }

    @keyframes glide {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    @keyframes fill { to { width: 72%; } }

    @media (max-width: 600px) {
      header, footer { padding: 20px; }
      .header-right { display: none; }
      footer { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#">
      <img src="./image/logo-blue.png" alt="Company Logo" class="logo-icon" style="object-fit: contain;"/>
        <!-- <div class="logo-text">
            <span class="logo-name">AutoVélo</span>
            <span class="logo-sub">Premium Motors</span>
        </div> -->
    </a>
    <!-- <span class="header-right">Est. 2024</span> -->
  </header>

  <main>



    <div class="badge">
      <span class="badge-dot"></span>
      we are getting ready
    </div>

    <h1>Under<em>Construction</em></h1>

    <p class="sub">
      Our new website is being built with the same precision we put into every vehicle. Something exceptional is on the way.
    </p>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Progress</span>
        <span>72%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="notify-wrap">
      <input type="email" placeholder="Enter your email address" />
      <button type="button">Notify Me</button>
    </div>

  </main>

    <span class="footer-copy">© 2024 AutoVélo Premium Motors. All rights reserved.</span>
    <nav class="footer-links">
      <a href="#">Contact</a>
      <a href="#">Privacy</a>
      <a href="#">Instagram</a>
    </nav>
  </footer> -->

</body>
</html>
